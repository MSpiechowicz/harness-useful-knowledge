[package]
name = "harness_knowledge"
description = "Project knowledge MCP server for any coding agent harness (documents, hybrid BM25 + vector search)"
version = "2.1.2"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/MSpiechowicz/harness-useful-knowledge"
publish = false

[lib]
path = "src/lib.rs"

# The stdio MCP server the harnesses' `mcp.json` entries start (`harness-knowledge mcp`).
[[bin]]
name = "harness-knowledge"
path = "src/main.rs"
doc = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: tool schemas and replies keep their keys in source order.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
# The secret patterns `support::redact` masks in messages.
regex = "1.13"
# Canonical paths without the Windows `\\?\` prefix.
dunce = "1.0.5"
# The team database config file (`<config dir>/harness-knowledge/config.toml`).
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# The temporary file of an atomic private write.
tempfile = "3.27.0"
# The local database (SQLite with FTS5), built into the binary.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
# The path globs of a document's repo links (`src/**/*.rs`).
globset = { version = "0.4.21", default-features = false }
# The PostgreSQL team backend (pgvector): the synchronous client, TLS through rustls with the ring
# provider (no OpenSSL), and the platform's trusted roots.
postgres = "0.19.14"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
# The MongoDB team backend (Atlas Search and Vector Search): the official driver's blocking API, TLS
# through rustls with ring, DNS for `mongodb+srv://` seed lists.
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver", "sync"] }
# The libSQL team backend (sqld, Turso): a blocking HTTP client for the Hrana pipeline API.
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider"] }
# The ingestion: token counts with the e5 tokenizer (no Oniguruma C library), the content and chunk hashes.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
sha2 = "0.11.1"
# The extractors: Markdown, HTML (the tokenizer only, no DOM), YAML for OpenAPI, PDF in a worker process
# and the NFKC normalisation of the PDF text.
pulldown-cmark = { version = "0.13.6", default-features = false }
html5ever = "0.39.0"
saphyr = { version = "0.3.3", default-features = false }
pdf-extract = "0.12.1"
# The PDF worker listens to the reader's log for a refused allocation.
log = "0.4"
unicode-normalization = "0.1.25"
# SIGTERM, SIGHUP and Ctrl-C cancel an import between two documents.
ctrlc = { version = "3.5.2", features = ["termination"] }
# The embedder (`harness-knowledge embedder`): the multilingual e5 model runs on tract (pure Rust, no
# native runtime to download) with the tokenizer above, and every `harness-knowledge mcp` asks it
# over a local socket.
tract-onnx = "0.23.9"
interprocess = "2.4.6"
# Returns the freed model memory to the operating system (glibc keeps it), so the embedder's idle
# unload gives it back.
mimalloc = "0.1"

# Kills a timed-out git together with its process group (`killpg`), tells the user a file belongs to,
# and limits the memory and CPU time of the PDF worker (`resource`).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "user", "resource"] }

# The security descriptor string and the secret name of the embedder's named pipe (see `src/embed/pipe.rs`).
[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
getrandom = "0.4.3"

[dev-dependencies]
pretty_assertions = "1.4"
# Compresses the decompression bomb the PDF worker's limits are tested with (already built for lopdf).
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
strip = true
