[package]
name = "harness_knowledge"
description = "Project knowledge MCP server for any coding agent harness (documents, hybrid BM25 + vector search)"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/MSpiechowicz/harness-useful-knowledge"
publish = false

[lib]
path = "src/lib.rs"

# The stdio MCP server the harnesses' `mcp.json` entries start (`harness-knowledge mcp`).
[[bin]]
name = "harness-knowledge"
path = "src/main.rs"
doc = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: tool schemas and replies keep their keys in source order.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
# The secret patterns `support::redact` masks in messages.
regex = "1.13"
# Canonical paths without the Windows `\\?\` prefix.
dunce = "1.0.5"
# The team database config file (`<config dir>/harness-knowledge/config.toml`).
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# The temporary file of an atomic private write.
tempfile = "3.27.0"
# The local database (SQLite with FTS5), built into the binary.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
# The path globs of a document's repo links (`src/**/*.rs`).
globset = { version = "0.4.21", default-features = false }
# The PostgreSQL team backend (pgvector): the synchronous client, TLS through rustls with the ring
# provider (no OpenSSL), and the platform's trusted roots.
postgres = "0.19.14"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
# The MongoDB team backend (Atlas Search and Vector Search): the official driver's blocking API, TLS
# through rustls with ring, DNS for `mongodb+srv://` seed lists.
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver", "sync"] }
# The libSQL team backend (sqld, Turso): a blocking HTTP client for the Hrana pipeline API.
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider"] }

# Kills a timed-out git together with its process group (`killpg`), and tells the user a file belongs to.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "user"] }

[dev-dependencies]
pretty_assertions = "1.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
strip = true
